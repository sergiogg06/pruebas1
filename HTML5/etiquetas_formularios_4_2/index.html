<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Datos personales</legend>
            <label for="nombre">Nombre y apellidos: </label>
            <input id="nombre" type="text" size="100" required minlength="4" maxlength="8" placeholder="Escribe tu nombre: "><br>
    
            <label for="sexo">Sexo: </label>
            <select id="sexo" name="sexo">
                <!--Etiqueta option-->
                <option value="1">Hombre</option> 
                <option value="2" selected>Mujer</option>
                <option value="3">Otre</option> 

            </select><br><br>
    
            <label>Edad: </label>
            <input type="checkbox" value="20-39"> 20-39
            <input type="checkbox" value="40-59"> 40-59
            <input type="checkbox" value="60-79"> 60-79<br><br>

            <label for="calendario">Fecha de nacimiento</label>
            <input type="date" id="calendario" name="calendario">
    
            <label for="email">Email: </label>
            <input id="email" type="email"><br><br>
    
            <label for="estudios">Estudios: </label>
            <select id="estudios">
               <optgroup label="Estudios Universitarios">
                  <option>Doctorado</option>
                  <option>Máster</option>
                  <option>Grado</option>
               </optgroup>
               <optgroup label="Ciclo Formativo">
                  <option>Grado Superior</option>
                  <option>Grado Medio</option>
               </optgroup>
            </select><br><br>
        </fieldset>
            <fieldset>
                <legend>Preferencias</legend>
          <label for="navegador">Elige tu navegador favorito: </label>
          <input id="navegador" list="browsers">
            <datalist id="browsers">
                <option value="Chrome">
                <option value="Firefox">
                <option value="Internet Explorer">
                <option value="Opera">
                <option value="Safari">
                <option value="Microsoft Edge">
            </datalist><br><br>
    
            <label for="mensaje">Escribe tu mensaje: </label>
            <textarea rows="10" cols="50" placeholder="Mensaje" id="mensaje"></textarea>
        </fieldset>  
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
